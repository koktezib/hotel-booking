server:
  port: ${PORT:8081}
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotel-service;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false
security:
  jwt:
    secret: ${JWT_SECRET:local-demo-key-change-before-production-0123456789}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
demo:
  enabled: ${DEMO_ENABLED:false}
